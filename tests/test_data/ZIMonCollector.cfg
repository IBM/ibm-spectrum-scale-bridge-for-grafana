# ZIMonCollector configuration file
#
# Content after # are ignored.  Each parameter definition must start
# on a separate line.  The following parameter types are supported:
# - flags ... boolean values and specified as T or Y for true and F or
#   N or false.
# - strings ... must be quoted.
# - numbers ... integer numbers.
# - complex parameters are enclosed in braces { } and contain
#   parameter assignments.

# Run as daemon in the background (default: N).
daemonize = Y

# Interface over which incoming IPFIX traffic is expected (default: 0.0.0.0).
# For IPv6 or dual stack environments, use ::0
ipfixinterface = "0.0.0.0"

# The port number that is used for incoming IPFIX traffic.
ipfixport = "4739"

# The file which contains the IPFIX IP allowlist to control incoming IPFIX traffic.
# IPv4 and IPv6 addresses are supported.
# The allowlist file format is one ip per line, analog to the IBM Storage Scale
# daemon IP address node files (e.g. /var/mmfs/gen/nodeFiles/mmfsall.ipa)
# The file needs to be accessible by the pmcollector user id scalepm.
# The allowlist check is disabled per default and can be enabled by specifying
# the ipfixiplist option.
# The file will be re-read periodically (default 300s), this interval
# can be configured by specifying the ipfixiplistrefresh option.
#ipfixiplist = "/var/mmfs/gen/nodeFiles/mmfsall.ipa"
#ipfixiplistrefresh = 300

# The query socket defines the UNIX domain socket file over which incoming
# queries are accepted. Default is /run/perfmon/pmcollector.socket
querysocket = "/run/perfmon/pmcollector.socket"

# Interface over which federation data is exchanged with other peers
# (default: 0.0.0.0).
# For IPv6 or dual stack environments, use ::0
federationinterface = "0.0.0.0"

# Port number that is used for federation connections (default: 9085).
federationport = "9085"

# Path and filename of the logfile (default: stdout if running in
# non-daemon mode, "ZIMonCollector.log" if running in daemon mode).
# Use "stdout" to send logging data to stdout.
# Use "syslog" to send logging data to the syslog daemon.
logfile = "/var/log/zimon/ZIMonCollector.log"

# Log levels are: debug, info, warning, error (default: info).
loglevel = "info"

# Directory that is used to store the pid file (default: /run).
piddir = "/run"

# Location of the on-disk collector database (default: ./data).
datadir = "/opt/IBM/zimon/data"

# Turns the internal sensor on or off (default: off).
internalsensor = N

# The federation peers are collectors that provide access to their
# metrics store.  All peers SHOULD list each other.  The host itself
# can be included such that the same configuration file can be used by
# all peers.
# peers = {
# 	host = "zimon1"
# 	port = "9085"
# }, {
# 	host = "zimon2"
# 	port = "9085"
# }

# Definition of maximum domain of sensors to prevent their data aggregation to higher domains.

sensormaxdomain = {
	name = "GPFSFabricHospital"
	maxdomain = 2
},{
	name = "GPFSTSCOM"
	maxdomain = 2
},{
	name = "GPFSPIDStats"
	maxdomain = 2
},{
	name = "GPFSRPCS"
	maxdomain = 2
}

# Defines the data domains and aggregation levels.
#
# The first domain is the raw domain. Any aggregation factor for this
# domain is ignored.  For the other domains, a positive aggregation
# factor must be specified.  The domains specify the maximum amount of
# memory that should be used AND/OR the maximum time period that the
# data should be retained per domain.  If both are given, whichever
# condition hits first is used.
#
# In addition, for each domain the amount of disk memory should be
# specified.  Data is also stored on disk in case the collector needs
# to restart or the process is killed.  This is specified as the
# maximum number of files and the maximum file sizes must be
# specified.  Persistent data is split into multiple files.  Once the
# number of files is reached, the oldest file is discarded and a new
# is created. The number of files minus 1 multiplied by the file size
# should be the amount of memory required for the domain to store its
# monitoring data.
#
# Memory is specified in string format and can include K, M, G for
# kilo, mega and giga.
#
# Durations may include h for hours, w for weeks, m for months, y for
# years.
domains = {
	# this is the raw domain
	aggregation = 0		# aggregation factor for the raw domain is always 0.
#	ram = "500m"		# amount of RAM to be used
	duration = "12h"	# amount of time that data with the highest precision is kept.
	filesize = "1g"	# maximum file size
	files = 5		# number of files.
}, {
	# this is the first aggregation domain that aggregates to 30 seconds
	aggregation = 30
#	ram = "800m"		# amount of RAM to be used
	duration = "1w"		# keep 30 second aggregates for 1 week.
	filesize = "1g"		# maximum file size
	files = 5		# number of files.
}, {
	# this is the second aggregation domain that aggregates to 30*30 seconds == 15 minutes
	aggregation = 30
#	ram = "800m"		# amount of RAM to be used
	duration = "2m"		# keep 15 minute averages for 2 months.
	filesize = "1g"		# maximum file size
	files = 5		# number of files.
}, {
	# this is the third aggregation domain that aggregates to 30*30*24 seconds == 6 hours
	aggregation = 24
#	ram = "800m"		# amount of RAM to be used
	duration = "1y"		#
	filesize = "1g"		# maximum file size
	files = 5		# number of files.
}

peers = {
	host = "scale-21.vmlocal"
	port = "9085"
}, {
	host = "scale-22.vmlocal"
	port = "9085"
}

